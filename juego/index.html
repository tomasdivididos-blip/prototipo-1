<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Acústica — Juego</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ MENÚ ══ -->
<section id="menu" class="screen">
  <header class="hero">
    <h1>Acústica</h1>
    <p class="sub">Preguntas y ejercicios numéricos</p>
  </header>

  <div class="stats-row">
    <div class="stat"><b id="st-racha">0</b><span>racha máx</span></div>
    <div class="stat"><b id="st-vistas">0</b><span>respondidas</span></div>
    <div class="stat"><b id="st-pct">—</b><span>acierto</span></div>
  </div>

  <h2 class="lbl">Áreas</h2>
  <div id="areas" class="areas"></div>

  <button id="btn-jugar" class="btn primary big">Jugar</button>
  <button id="btn-repaso" class="btn ghost">Repasar mis errores (<span id="n-err">0</span>)</button>

  <footer class="foot">
    <span id="n-banco">—</span>
    <button id="btn-reset" class="linkbtn">Borrar progreso</button>
  </footer>
</section>

<!-- ══ PARTIDA ══ -->
<section id="juego" class="screen hidden">
  <div class="topbar">
    <button id="btn-salir" class="iconbtn" aria-label="Volver al menú">✕</button>
    <div class="progress"><div id="bar"></div></div>
    <div class="racha" id="racha-live" aria-live="polite">🔥 0</div>
  </div>

  <div class="qmeta">
    <span class="cat" id="q-cat"></span>
    <span class="dif" id="q-dif"></span>
  </div>

  <div class="card">
    <p class="q" id="q-text"></p>
    <div id="opts" class="opts"></div>
  </div>

  <div id="fb" class="fb hidden">
    <p class="fb-head" id="fb-head"></p>
    <div class="why" id="fb-why"></div>
    <p class="src" id="fb-src"></p>
    <button id="btn-next" class="btn primary big">Siguiente</button>
  </div>
</section>

<!-- ══ RESUMEN ══ -->
<section id="fin" class="screen hidden">
  <header class="hero">
    <h1 id="fin-score">—</h1>
    <p class="sub" id="fin-sub"></p>
  </header>
  <div id="fin-cats" class="fincats"></div>
  <button id="btn-otra" class="btn primary big">Otra ronda</button>
  <button id="btn-menu" class="btn ghost">Menú</button>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
