// LÓGICA INTERACTIVA
// =====================================================================
const state = {
  i: 0,
  answers: new Array(BANK.length).fill(null),
};

const quizEl = document.getElementById("quiz");
const barEl = document.getElementById("bar");
const subEl = document.getElementById("sub");

function render() {
  if (state.i >= BANK.length) return renderResults();

  const q = BANK[state.i];
  const userAns = state.answers[state.i];
  const isAnswered = userAns !== null;

  const optsHtml = q.opts.map((opt, idx) => {
    let cls = "opt";
    if (isAnswered) {
      if (idx === q.ans) cls += " good";
      else if (idx === userAns) cls += " bad";
    }
    return `<button class="${cls}" data-idx="${idx}" ${isAnswered ? "disabled" : ""}>${opt}</button>`;
  }).join("");

  const explainHtml = isAnswered
    ? `<div class="explain"><b>${userAns === q.ans ? "✓ Correcto." : "✗ Incorrecto."}</b> ${q.why}</div>`
    : "";

  const navHtml = `
    <div class="nav">
      <button class="btn ghost" id="back" ${state.i === 0 ? "disabled" : ""}>← Atrás</button>
      <button class="btn" id="next" ${!isAnswered ? "disabled" : ""}>
        ${state.i === BANK.length - 1 ? "Ver resultado" : "Siguiente →"}
      </button>
    </div>
  `;

  quizEl.innerHTML = `
    <div class="card">
      <div class="cat">${q.cat}</div>
      <div class="qnum">Pregunta ${state.i + 1} de ${BANK.length}</div>
      <div class="qtext">${q.q}</div>
      <div class="opts">${optsHtml}</div>
      ${explainHtml}
      ${navHtml}
    </div>
  `;

  barEl.style.width = ((state.i + (isAnswered ? 1 : 0)) / BANK.length * 100) + "%";

  // listeners
  document.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      if (state.answers[state.i] !== null) return;
      state.answers[state.i] = parseInt(btn.dataset.idx, 10);
      render();
    });
  });
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { state.i++; render(); window.scrollTo(0, 0); });
  const back = document.getElementById("back");
  if (back) back.addEventListener("click", () => { state.i--; render(); window.scrollTo(0, 0); });
}

function renderResults() {
  const total = BANK.length;
  const correct = state.answers.filter((a, i) => a === BANK[i].ans).length;
  const pct = Math.round(correct / total * 100);

  // por categoría
  const byCat = {};
  BANK.forEach((q, i) => {
    if (!byCat[q.cat]) byCat[q.cat] = { ok: 0, tot: 0 };
    byCat[q.cat].tot++;
    if (state.answers[i] === q.ans) byCat[q.cat].ok++;
  });

  let verdict;
  if (pct >= 90) verdict = "Dominio sólido. Podés explicar el código sin trabarte.";
  else if (pct >= 75) verdict = "Buen nivel. Repasá los temas en rojo y queda redondo.";
  else if (pct >= 60) verdict = "Aprobado, pero conviene volver a los markdowns y refrescar lo flojo.";
  else verdict = "Conviene una segunda pasada por los explicadores antes de re-evaluar.";

  const catRows = Object.entries(byCat).map(([cat, s]) => {
    const cp = Math.round(s.ok / s.tot * 100);
    const color = cp >= 75 ? "var(--good)" : cp >= 50 ? "var(--warn)" : "var(--bad)";
    return `<div class="cat-row"><span>${cat}</span><span style="color:${color}">${s.ok}/${s.tot} (${cp}%)</span></div>`;
  }).join("");

  quizEl.innerHTML = `
    <div class="card results">
      <h2>Resultado</h2>
      <div class="score-big">${correct} / ${total}</div>
      <div style="font-size:1.3rem">${pct}%</div>
      <div class="verdict">${verdict}</div>
      <div class="cat-scores">${catRows}</div>
      <button class="btn" id="restart">Reintentar</button>
    </div>
  `;
  barEl.style.width = "100%";
  document.getElementById("restart").addEventListener("click", () => {
    state.i = 0;
    state.answers = new Array(BANK.length).fill(null);
    render();
    window.scrollTo(0, 0);
  });
}

subEl.textContent = `Evaluación exhaustiva: ${BANK.length} preguntas en ${[...new Set(BANK.map(q => q.cat))].length} categorías. Cada respuesta se bloquea al marcar y muestra la explicación.`;
render();
</script>
